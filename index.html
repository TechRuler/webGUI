<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    color: white;
    padding: 20px;
}

.tree {
    user-select: none;
}

.tree-node {
    margin-left: 20px;
}

.tree-header {
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
}

.tree-header:hover {
    background: #333;
}

.tree-children {
    margin-left: 20px;
    display: none;
}

.arrow {
    display: inline-block;
    width: 16px;
}
</style>
</head>
<body>

<div class="tree">

    <div class="tree-node">

        <div class="tree-header">
            <span class="arrow">▶</span>
            📁 Project
        </div>

        <div class="tree-children">

            <div class="tree-node">

                <div class="tree-header">
                    <span class="arrow">▶</span>
                    📁 src
                </div>

                <div class="tree-children">

                    <div class="tree-node">
                        <div class="tree-header">
                            📄 main.py
                        </div>
                    </div>

                    <div class="tree-node">
                        <div class="tree-header">
                            📄 utils.py
                        </div>
                    </div>

                </div>

            </div>

            <div class="tree-node">
                <div class="tree-header">
                    📄 README.md
                </div>
            </div>

        </div>

    </div>

</div>

<script>
document.querySelectorAll(".tree-header").forEach(header => {

    header.addEventListener("click", () => {

        const children =
            header.parentElement.querySelector(":scope > .tree-children");

        if (!children) return;

        const arrow =
            header.querySelector(".arrow");

        if (children.style.display === "block") {
            children.style.display = "none";
            arrow.textContent = "▶";
        } else {
            children.style.display = "block";
            arrow.textContent = "▼";
        }

    });

});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
.switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    transition: 0.3s;
    border-radius: 34px;
}

.slider::before {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    left: 4px;
    bottom: 4px;
    background: white;
    transition: 0.3s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #4CAF50;
}

input:checked + .slider::before {
    transform: translateX(26px);
}
</style>
</head>
<body>

<label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
</label>

<script>
document.getElementById("toggle").addEventListener("change", function() {
    console.log("Switch:", this.checked);
});
</script>

</body>
</html>
